
<head>

   <title>Registration Form</title>

  <style>

    body { font-family: Arial,
        sans-serif;   
        background: #f2f4f8;
        display: flex;
        justify-content: center; 
        padding: 40px 16px; 
        }
    form { background: #fff;
         padding: 24px; 
         border-radius: 8px; 
         width: 100%; 
         max-width: 360px; 
         box-shadow: 0 2px 8px rgba(0,0,0,.1);
         }
    h1 { margin-top: 0; 
        color: #1a73e8; 
       }
  label { display: block;
         margin-top: 14px; 
         font-weight: bold; 
        }
 input { width: 100%;
         padding: 8px; 
         margin-top: 4px; 
         box-sizing: border-box; 
         border: 1px solid #ccc; 
         border-radius: 4px; 
        }
    input.invalid { border-color: #d93025; }
    input.valid { border-color: #1e8e3e; }
    .error { color: #d93025; 
        font-size: 13px; 
        min-height: 16px; 
        margin-top: 4px; 
    }
    button { width: 100%; 
        margin-top: 18px; 
        padding: 10px; 
        border: none; 
        border-radius: 4px; 
        background: #1a73e8; 
        color: #fff; 
        font-size: 16px; 
        cursor: pointer; }
    button:disabled { background: #aaa; 
        cursor: not-allowed; }
    #success { color: #1e8e3e; 
        margin-top: 12px; 
        text-align: center; }

  </style>

</head>

<body>
  <form id="registerForm" novalidate>
    <h1>Register</h1>

    <label for="name">Name</label>
    <input type="text" id="name" placeholder="Enter your name">
    <div class="error" id="nameError"></div>

    <label for="email">Email</label>
    <input type="email" id="email" placeholder="Enter your email">
    <div class="error" id="emailError"></div>

    <label for="password">Password</label>
    <input type="password" id="password" placeholder="Minimum 6 characters">
    <div class="error" id="passwordError"></div>

    <button type="submit" id="submitBtn" disabled>Register</button>
    <div id="success"></div>
  </form>

  <script>
    const form = document.getElementById("registerForm");
    const nameInput = document.getElementById("name");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const submitBtn = document.getElementById("submitBtn");
    const success = document.getElementById("success");

    const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    // Each validator returns an error message, or "" if valid
    function validateName() {
      return nameInput.value.trim() === "" ? "Name cannot be empty." : "";
    }
    function validateEmail() {
      return emailPattern.test(emailInput.value.trim()) ? "" : "Please enter a valid email address.";
    }
    function validatePassword() {
      return passwordInput.value.length >= 6 ? "" : "Password must be at least 6 characters.";
    }

    function showResult(input, errorId, message) {
      document.getElementById(errorId).textContent = message;
      input.classList.toggle("invalid", message !== "");
      input.classList.toggle("valid", message === "");
    }

    // Runs on every keystroke (real-time) and updates the submit button
    function validateForm() {
      const nameMsg = validateName();
      const emailMsg = validateEmail();
      const passMsg = validatePassword();

      showResult(nameInput, "nameError", nameMsg);
      showResult(emailInput, "emailError", emailMsg);
      showResult(passwordInput, "passwordError", passMsg);

      submitBtn.disabled = !(nameMsg === "" && emailMsg === "" && passMsg === "");
    }

    [nameInput, emailInput, passwordInput].forEach(function (input) {
      input.addEventListener("input", validateForm);
    });

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      if (submitBtn.disabled) return;
      success.textContent = "Registration successful!";
      form.reset();
      [nameInput, emailInput, passwordInput].forEach(function (i) { i.classList.remove("valid", "invalid"); });
      submitBtn.disabled = true;
    });
  </script>
</body>
</html>
